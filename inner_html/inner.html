<!DOCTYPE html>
<html>
<head>
    <title>Belajar innerHTML</title>
</head>

<body>

    <h1 id="demo"></h1>

    <script>
        document.getElementById("demo").innerHTML = "Hello devstart!";
    </script>

</body>
</html>

<!-- Nah, kalau tadi console.log hasilnya cuma bisa kita lihat di Console, 
 sekarang kita coba bikin JavaScript mengubah isi halaman kita langsung. 
 Anggap aja HTML ini sebagai sebuah gedung, dan di dalam gedung ada banyak papan. 
 Kita kasih salah satu papan ini ID demo. JavaScript nanti kita suruh nyari papan yang ID-nya demo. 
 Setelah ketemu, kita bilang, 'oke, sekarang tulisan di papan ini ganti jadi Hello JavaScript.' 
 Nah, proses mengganti tulisan itulah yang kita lakukan menggunakan innerHTML -->
