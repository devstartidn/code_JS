<!DOCTYPE html>
<html>
<head>
    <title>Inline JavaScript</title>
</head>

<body>

    <h1 id="judul">Belajar JavaScript</h1>

    <button onclick="document.getElementById('judul').style.color = 'blue'">
        Ubah Warna
    </button>

</body>
</html>

<!-- Hasil: klik tombol → tulisan Belajar JavaScript berubah menjadi biru. -->
